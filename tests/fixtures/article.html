<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>城市漫步观察笔记 · 伴读小宠物测试</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #25292a; background: #f7f8f8; font-family: Georgia, "PingFang SC", "Microsoft YaHei", serif; }
    article { max-width: 760px; margin: 0 auto; padding: 80px 36px 140px; background: #fff; min-height: 100vh; }
    h1 { max-width: 600px; margin: 0 0 20px; font-size: 42px; line-height: 1.2; }
    .meta { margin-bottom: 56px; color: #798080; font-family: system-ui, sans-serif; font-size: 13px; }
    p { margin: 0 0 28px; font-size: 19px; line-height: 2; }
    .demo-form { margin-top: 64px; padding-top: 36px; border-top: 1px solid #e5e8e8; font-family: system-ui, sans-serif; }
    .demo-form h2 { font-size: 22px; }
    .demo-form label { display: grid; gap: 8px; margin: 18px 0; font-size: 14px; }
    .demo-form input { width: 100%; max-width: 420px; padding: 12px; border: 1px solid #cbd1d1; border-radius: 8px; font: inherit; }
    .demo-form button { padding: 10px 16px; border: 0; border-radius: 8px; color: #fff; background: #3f5d57; font: inherit; cursor: pointer; }
    .tall-note { margin-top: 900px; padding: 24px; border-left: 3px solid #b96836; background: #faf6f0; }
  </style>
</head>
<body>
  <article>
    <h1>城市漫步观察笔记</h1>
    <div class="meta">阅读测试样例 · 选区与提醒验证</div>
    <p id="paragraph-one">城市漫步并不是简单地走得慢，而是把一部分注意力从目的地挪回沿途。观察者会留意街角的尺度、店铺的灯光和行人停留的位置，由此理解道路如何影响日常活动。</p>
    <p id="paragraph-two">记录时，可以先写下亲眼看到的事实，再补充自己的解释。例如，“三个人在树荫下停留”是观察，“树荫可能让这里更适合休息”是解释。把两者分开，能减少把猜测误当成事实的情况。</p>
    <p id="paragraph-three">一段文字如果没有说明时间、地点或因果关系，就不应替它补出确定结论。可靠的理解需要回到原文，看清每句话真正提供了什么。</p>
    <form class="demo-form" id="demo-form">
      <h2>阅读标记</h2>
      <label>你的名字（仅用于触发表单停顿，不会发送）<input name="name" autocomplete="off" /></label>
      <label>邮箱（留空并提交可触发本地校验）<input name="email" type="email" required placeholder="name@example.com" /></label>
      <button type="submit">保存标记</button>
    </form>
    <p class="tall-note" id="tall-note">这是页面后部的另一段文字，用来验证滚动、拖动和证据定位。你可以选中它，再观察小狗的状态。</p>
  </article>
</body>
</html>
